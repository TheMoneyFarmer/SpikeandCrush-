<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Spike & Crush — Spectate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/game.css" />
<link rel="stylesheet" href="css/premium.css" />
</head>
<body data-page="spectate">
  <div class="game-shell">
    <div class="game-topbar">
      <div class="topbar-timer" id="topbarTimer">--:--</div>
      <div class="topbar-pnl-block">
        <div class="topbar-pnl-label">SPECTATING</div>
        <div class="topbar-pnl-value">👁️</div>
      </div>
      <div class="instrument-tabs" id="instrumentTabs"></div>
      <a href="/" class="btn btn-outline">Exit</a>
    </div>

    <div class="game-main">
      <div class="chart-section">
        <div class="chart-quotes">
          <div class="quote"><span class="label">Bid</span><span class="bid mono" id="quoteBid">-</span></div>
          <div class="quote"><span class="label">Ask</span><span class="ask mono" id="quoteAsk">-</span></div>
          <div class="quote"><span class="label">Spread</span><span class="mono" id="quoteSpread">-</span></div>
        </div>
        <div id="chartCanvas"></div>
      </div>
      <div class="trading-panel">
        <h3>Live Leaderboard</h3>
        <table class="leaderboard-table">
          <thead><tr><th>#</th><th>Player</th><th>P&amp;L</th><th>Trades</th></tr></thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </div>
    </div>

    <div class="match-feed">
      <div class="match-feed-track" id="feedTrack"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/leaderboard.js"></script>
  <script>
    TW.requireAuth();
    const params = new URLSearchParams(window.location.search);
    const matchId = params.get('matchId');
    if (!matchId) window.location.href = '/';

    TW.Chart.init('chartCanvas');
    let activeInstrument = 'EURUSD';
    let lastPrices = {};

    function formatClock(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = Math.floor(totalSeconds % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function setupInstrumentTabs(instruments) {
      const wrap = document.getElementById('instrumentTabs');
      if (wrap.dataset.built) return;
      wrap.dataset.built = '1';
      instruments.forEach((sym, i) => {
        const btn = document.createElement('button');
        btn.className = 'instrument-tab' + (i === 0 ? ' active' : '');
        btn.textContent = sym;
        btn.addEventListener('click', () => {
          activeInstrument = sym;
          wrap.querySelectorAll('.instrument-tab').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          TW.Chart.setActiveSymbol(sym);
          renderQuotes();
        });
        wrap.appendChild(btn);
      });
      activeInstrument = instruments[0];
      TW.Chart.setActiveSymbol(activeInstrument);
    }

    function renderQuotes() {
      const price = lastPrices[activeInstrument];
      if (!price) return;
      document.getElementById('quoteBid').textContent = price.bid;
      document.getElementById('quoteAsk').textContent = price.ask;
      document.getElementById('quoteSpread').textContent = price.spread;
    }

    const feedEntries = [];
    function renderFeed() {
      const track = document.getElementById('feedTrack');
      track.innerHTML = feedEntries.map((t) => `<span>${TW.escapeHtml(t)}</span>`).join('<span>•</span>');
      track.style.animation = 'none';
      void track.offsetWidth;
      track.style.animation = '';
    }
    function pushFeed(text) {
      feedEntries.push(text);
      if (feedEntries.length > 25) feedEntries.shift();
      renderFeed();
    }

    const socket = TW.connectSocket();
    if (!socket) window.location.href = '/';

    socket.on('connect', async () => {
      const result = await TW.emitAck('spectate:join', { matchId });
      if (!result.success) TW.toast(result.error || 'Could not spectate this match', 'danger');
    });

    socket.on('match:state', (state) => setupInstrumentTabs(state.instruments));
    socket.on('price:update', (data) => {
      lastPrices = data.prices;
      Object.entries(data.prices).forEach(([symbol, price]) => TW.Chart.pushTick(symbol, data.elapsedSeconds, price.mid));
      renderQuotes();
      document.getElementById('topbarTimer').textContent = formatClock(data.timeRemaining);
    });
    socket.on('match:feed', (entry) => pushFeed(entry.text));
    socket.on('leaderboard:update', (payload) => TW.Leaderboard.render(payload, null));
    socket.on('match:end', () => {
      TW.toast('This match has ended', 'info');
      setTimeout(() => (window.location.href = '/'), 2500);
    });
  </script>
</body>
</html>
