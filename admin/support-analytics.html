<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Support Analytics — Spike & Crush Admin</title>
<link rel="icon" href="/icons/admin.svg" type="image/svg+xml" />
<link rel="icon" href="/icons/admin-32.png" type="image/png" sizes="32x32" />
<link rel="stylesheet" href="css/admin-base.css" />
<link rel="stylesheet" href="css/admin-tables.css" />
<link rel="stylesheet" href="css/admin-components.css" />
<link rel="stylesheet" href="css/admin-support.css" />
<link rel="stylesheet" href="css/admin-console.css" />
<link rel="stylesheet" href="css/admin-records.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar" data-active="support-analytics"></aside>
    <main class="admin-main">
      <div class="admin-topbar" id="adminTopbar"></div>
      <div class="admin-content">
        <div class="admin-table-toolbar">
          <span id="aRange"></span>
          <span class="sup-spacer"></span>
          <a class="btn btn-outline" id="aExport" hidden>Export CSV</a>
        </div>
        <div class="panel" id="aiBudget" style="margin-bottom:16px">
          <h3 style="margin-top:0">AI assistant budget (today, UTC)</h3>
          <p class="text-secondary" id="aiUsage" style="margin:0 0 10px">Loading</p>
          <form id="aiBudgetForm" style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end" novalidate>
            <label style="display:flex;gap:8px;align-items:center;min-height:40px"><input type="checkbox" id="aiEnabled" /> AI answers on</label>
            <div class="field" style="margin:0"><label for="aiCap">Daily token cap</label><input id="aiCap" type="number" min="10000" step="10000" style="width:180px" /></div>
            <button class="btn btn-primary" type="submit" id="aiSave">Save</button>
            <span class="text-secondary" id="aiNote" role="status" style="font-size:12px"></span>
          </form>
          <p class="text-secondary" style="font-size:12px;margin:10px 0 0">Over the cap, or with AI answers off, every message goes to a person and the player is told support is busy. You get an email at 50%, 80% and 100%. Changes apply within 30 seconds.</p>
        </div>
        <div id="aBody"><div class="sup-empty">Loading</div></div>
      </div>
    </main>
  </div>
  <script src="js/time-ago.js"></script>
  <script src="js/admin-api.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-nav.js"></script>
  <script src="js/date-range.js"></script>
  <script>
  (function () {
    Admin.renderNav();
    Admin.renderTopbar('Support Analytics');
    const esc = Admin.escapeHtml;
    const $ = (id) => document.getElementById(id);
    const fmt = (v, unit = '') => (v === null || v === undefined ? '—' : `${v}${unit}`);
    const mins = (m) => (m === null || m === undefined ? '—' : m < 120 ? `${m} min` : `${Math.round(m / 60)} h`);
    let range = null;
    (async function aiBudget() {
      const usage = document.getElementById('aiUsage');
      const note = document.getElementById('aiNote');
      const show = (d) => {
        const pct = d.dailyTokenCap ? Math.round((d.tokensToday / d.dailyTokenCap) * 100) : 0;
        usage.textContent = `${d.tokensToday.toLocaleString()} of ${d.dailyTokenCap.toLocaleString()} tokens used (${pct}%). AI answers are ${d.enabled ? 'on' : 'off'}.`;
        document.getElementById('aiEnabled').checked = d.enabled;
        document.getElementById('aiCap').value = d.dailyTokenCap;
      };
      try {
        const d = await Admin.api('/support/ai-budget');
        show(d);
        if (!d.canEdit) { document.querySelectorAll('#aiBudgetForm input, #aiBudgetForm button').forEach((x) => { x.disabled = true; }); note.textContent = 'Your role can view this but not change it.'; }
        document.getElementById('aiBudgetForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          note.textContent = 'Saving…';
          try {
            const r = await Admin.api('/support/ai-budget', { method: 'PUT', body: { enabled: document.getElementById('aiEnabled').checked, dailyTokenCap: Number(document.getElementById('aiCap').value) } });
            show({ ...d, ...r });
            note.textContent = 'Saved. Applies within 30 seconds.';
          } catch (err) { note.textContent = err.message; }
        });
      } catch (e) { usage.textContent = e.message; }
    })();

    async function load() {
      try {
        if (!range) range = await Admin.DateRange.mount($('aRange'), { defaultPreset: '30d', onChange: () => load() });
        const d = await Admin.api(`/support/analytics?${range.query()}`);
        $('aExport').hidden = !d.canExport;
        $('aExport').href = `/api/support/analytics-export?${range.query()}`;
        const max = Math.max(1, ...d.perDay.map((p) => p.count));
        $('aBody').innerHTML = `
          <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-label">Conversations</div><div class="kpi-value">${fmt(d.totalConversations)}</div></div>
            <div class="kpi-card"><div class="kpi-label">Solved by AI without a human</div><div class="kpi-value">${fmt(d.aiOnlyPct, '%')}</div></div>
            <div class="kpi-card"><div class="kpi-label">Escalation rate</div><div class="kpi-value">${fmt(d.escalationRatePct, '%')}</div></div>
            <div class="kpi-card"><div class="kpi-label">Median first human response</div><div class="kpi-value">${mins(d.medianFirstResponseMinutes)}</div></div>
            <div class="kpi-card"><div class="kpi-label">Median resolution time</div><div class="kpi-value">${mins(d.medianResolutionMinutes)}</div></div>
            <div class="kpi-card"><div class="kpi-label">CSAT (thumbs up)</div><div class="kpi-value">${fmt(d.csatPositivePct, '%')}</div><div class="kpi-sub">${d.csatResponses} responses</div></div>
          </div>
          <div class="panel" style="margin-top:16px"><h3 style="margin-top:0">Conversations per day</h3>
            ${d.perDay.length ? `<div class="sup-bars" role="img" aria-label="Conversations per day">${d.perDay.map((p) => `<div title="${esc(p.day)}: ${p.count}" style="height:${Math.round((p.count / max) * 100)}%"></div>`).join('')}</div>` : '<div class="text-secondary">No conversations in this period</div>'}
          </div>
          <div class="charts-grid" style="margin-top:16px">
            <div class="panel"><h3 style="margin-top:0">Top escalation reasons</h3>${d.topEscalationReasons.length ? `<table class="sup-mini">${d.topEscalationReasons.map((r) => `<tr><td>${esc(r.reason)}</td><td>${r.count}</td></tr>`).join('')}</table>` : '<div class="text-secondary">None</div>'}</div>
            <div class="panel"><h3 style="margin-top:0">Top KB gaps</h3>${d.topGaps.length ? `<table class="sup-mini">${d.topGaps.map((g) => `<tr><td>${esc(g.question)}</td><td>${g.count}</td></tr>`).join('')}</table>` : '<div class="text-secondary">None</div>'}<div style="margin-top:8px"><a href="/support-kb.html?tab=gaps">Open KB gaps</a></div></div>
          </div>`;
      } catch (e) {
        $('aBody').innerHTML = `<div class="sup-empty">${esc(e.message)}</div>`;
      }
    }
    load();
  })();
  </script>
</body>
</html>
