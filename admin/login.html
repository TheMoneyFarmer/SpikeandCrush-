<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel — Spike & Crush</title>
<link rel="icon" href="/icons/admin.svg" type="image/svg+xml" />
<link rel="icon" href="/icons/admin-32.png" type="image/png" sizes="32x32" />
<link rel="stylesheet" href="css/admin-base.css" />
<link rel="stylesheet" href="css/admin-components.css" />
</head>
<body>
  <div class="admin-login-wrap">
    <div class="admin-login-box">
      <div class="admin-login-title">Admin Panel</div>
      <div class="admin-login-sub">Spike &amp; Crush</div>
      <div id="loginError" class="admin-login-error"></div>
      <form id="loginForm">
        <div class="field">
          <label>Username or Email</label>
          <input type="text" id="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <div class="field" id="codeField" hidden>
          <label>6-digit code from your authenticator app</label>
          <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="loginBtn">Log In</button>
      </form>
      <form id="setupForm" hidden>
        <p class="text-secondary" style="font-size:13px;margin:0 0 12px;">Protect this account: scan this with an authenticator app (Google Authenticator, Authy, 1Password), then enter the code it shows.</p>
        <img id="setupQr" alt="Authenticator QR code" width="240" height="240" style="display:block;margin:0 auto 12px;border-radius:6px;" />
        <p class="text-secondary" style="font-size:12px;margin:0 0 12px;word-break:break-all;">Can't scan? Enter this key: <code id="setupKey"></code></p>
        <div class="field">
          <label>6-digit code</label>
          <input type="text" id="setupCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="setupBtn">Turn on and log in</button>
      </form>
      <div class="text-secondary" style="font-size:12px;text-align:center;margin-top:14px;">Contact Thando for admin access</div>
    </div>
  </div>
  <script>
    const postJson = (url, body) => fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body),
    });
    const finishLogin = (json) => {
      localStorage.setItem('admin_me', JSON.stringify({ username: json.username, lastLogin: json.lastLogin, ...json.admin }));
      window.location.href = '/dashboard.html';
    };
    let setupToken = null;

    async function beginSetup(token) {
      setupToken = token;
      const res = await postJson('/api/auth/2fa/setup', { setupToken });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Could not start setup');
      document.getElementById('setupQr').src = json.qr;
      document.getElementById('setupKey').textContent = json.secret;
      document.getElementById('loginForm').hidden = true;
      document.getElementById('setupForm').hidden = false;
      document.getElementById('setupCode').focus();
    }

    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('setupBtn');
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = '';
      btn.disabled = true;
      try {
        const res = await postJson('/api/auth/2fa/confirm', { setupToken, code: document.getElementById('setupCode').value });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Could not turn it on');
        finishLogin(json);
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      try {
        const res = await postJson('/api/auth/login', {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
          code: document.getElementById('code').value,
        });
        const json = await res.json();
        if (json.needCode) {
          const field = document.getElementById('codeField');
          const input = document.getElementById('code');
          const firstAsk = field.hidden;
          field.hidden = false;
          input.required = true;
          input.value = '';
          input.focus();
          if (!firstAsk) errorEl.textContent = json.error;
          btn.disabled = false;
          btn.textContent = 'Log In';
          return;
        }
        if (!res.ok) throw new Error(json.error || 'Login failed');
        if (json.setup2fa) { await beginSetup(json.setupToken); return; }
        finishLogin(json);
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
