<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics | Spike &amp; Crush Admin</title>
<link rel="icon" href="/icons/admin.svg" type="image/svg+xml" />
<link rel="icon" href="/icons/admin-32.png" type="image/png" sizes="32x32" />
<link rel="stylesheet" href="css/admin-base.css" />
<link rel="stylesheet" href="css/admin-tables.css" />
<link rel="stylesheet" href="css/admin-components.css" />
<link rel="stylesheet" href="css/admin-console.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .ax { --panel: var(--card); --tile: rgba(255, 255, 255, 0.78); --line: var(--border); --muted: var(--text-muted); --gold: var(--accent); --spike: var(--success); --crush: var(--danger);
        color: var(--text); font-family: Inter, system-ui, sans-serif; padding: 0; min-height: 70vh; }
  .ax h1, .ax h2, .ax h3 { font-family: Rajdhani, Inter, sans-serif; margin: 0; letter-spacing: .2px; }
  .ax h1 { font-size: 28px; }
  .ax h2 { font-size: 18px; margin-bottom: 8px; }
  .ax-sub { color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
  .ax-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: thin; }
  .ax-tabs button { flex: 0 0 auto; min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font: 600 13px Inter, sans-serif; cursor: pointer; }
  .ax-tabs button[aria-selected="true"] { color: var(--text); border-color: var(--gold); box-shadow: inset 0 -2px 0 var(--gold); }
  .ax-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 14px; }
  .ax-bar label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
  .ax-bar input, .ax-bar select { min-height: 36px; background: var(--tile); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; font: 13px Inter, sans-serif; min-width: 0; }
  .ax-bar input[type="text"] { width: 120px; }
  .ax-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .ax-seg button { min-height: 36px; padding: 0 10px; background: var(--tile); color: var(--muted); border: 0; font: 600 12px Inter, sans-serif; cursor: pointer; }
  .ax-seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .ax-toggle { flex-direction: row !important; align-items: center; gap: 6px !important; font-size: 12px !important; color: var(--text) !important; min-height: 36px; }
  .ax-btn { min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--gold); background: transparent; color: var(--gold); font: 600 13px Inter, sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .ax-btn svg { width: 16px; height: 16px; }
  .ax-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .ax-tile { background: var(--tile); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
  .ax-tile span { display: block; font-size: 12px; color: var(--muted); }
  .ax-tile b { display: block; font: 700 22px Rajdhani, Inter, sans-serif; margin-top: 4px; overflow-wrap: anywhere; }
  .ax-tile i { display: block; font-style: normal; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .ax-tile.red { border-color: var(--crush); } .ax-tile.red i { color: var(--crush); }
  .ax-tile.warning { border-color: var(--gold); } .ax-tile.warning i { color: var(--gold); }
  .ax-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; min-width: 0; }
  .ax-chart svg { width: 100%; height: 200px; display: block; }
  .ax-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .ax-legend b { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .ax-table { overflow-x: auto; }
  .ax-table table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ax-table th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .ax-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .ax-table td.num, .ax-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ax-table a { color: var(--gold); }
  .ax-note { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  .ax-empty, .ax-loading { color: var(--muted); padding: 30px 10px; text-align: center; font-size: 14px; }
  .ax-error { color: var(--crush); padding: 16px; }
  @media (max-width: 640px) {
    .ax { padding: 12px; border-radius: 0; }
    .ax-bar input[type="text"] { width: 100%; }
    .ax-bar label { flex: 1 1 45%; }
    .ax-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .ax-tile b { font-size: 19px; }
  }
</style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar" data-active="an-overview"></aside>
    <main class="admin-main">
      <div class="admin-topbar" id="adminTopbar"></div>
      <div class="admin-content">
        <section class="ax" aria-live="polite">
          <p class="ax-sub">From our own database. Internal traffic (admin, test and computer players) is left out unless you include it.</p>
          <nav class="ax-tabs" role="tablist" id="axTabs"></nav>
          <form class="ax-bar" id="axBar" onsubmit="return false">
            <div class="ax-seg" role="group" aria-label="Date range" id="axPresets">
              <button type="button" data-preset="today">Today</button><button type="button" data-preset="7">7 days</button><button type="button" data-preset="30" aria-pressed="true">30 days</button><button type="button" data-preset="90">90 days</button>
            </div>
            <label>From<input type="date" id="axFrom" /></label>
            <label>To<input type="date" id="axTo" /></label>
            <div class="ax-seg" role="group" aria-label="Time zone" id="axTz">
              <button type="button" data-tz="dubai" aria-pressed="true">Asia/Dubai</button><button type="button" data-tz="utc">UTC</button>
            </div>
            <label>Device<select id="axDevice"><option value="">All</option><option value="phone">Phone</option><option value="tablet">Tablet</option><option value="desktop">Desktop</option><option value="unknown">Unknown</option></select></label>
            <label>Mode<select id="axMode"><option value="">All</option><option>quick</option><option>blitz</option><option>grand</option><option>tournament</option><option>solo</option><option>private</option><option>stocks</option><option>futures</option><option>async</option></select></label>
            <label>Country<input type="text" id="axCountry" placeholder="e.g. AE" maxlength="2" /></label>
            <label>Source<input type="text" id="axSource" placeholder="e.g. google.com" /></label>
            <label>Campaign<input type="text" id="axCampaign" placeholder="campaign" /></label>
            <label>Page<input type="text" id="axPage" placeholder="/play" /></label>
            <label class="ax-toggle"><input type="checkbox" id="axInternal" /> Include internal traffic</label>
            <a class="ax-btn" id="axCsv" href="#" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>CSV</a>
          </form>
          <div id="axBody"><div class="ax-loading">Loading</div></div>
        </section>
      </div>
    </main>
  </div>
  <script src="js/time-ago.js"></script>
  <script src="js/admin-api.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-nav.js"></script>
  <script src="js/insights.js"></script>
  <script>Admin.renderNav(); Admin.renderTopbar('Analytics');</script>
</body>
</html>
